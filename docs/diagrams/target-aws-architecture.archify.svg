        <rect x="300" y="660" width="180" height="60" rx="6" class="c-mask"/>
        <rect x="300" y="660" width="180" height="60" rx="6" class="c-cloud" stroke-width="1.5"/>
        <text x="390" y="688" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">CloudWatch Logs</text>
        <text x="390" y="704" class="t-muted" font-size="9" text-anchor="middle">traces + warnings</text>

        <rect x="620" y="220" width="180" height="70" rx="6" class="c-mask"/>
        <rect x="620" y="220" width="180" height="70" rx="6" class="c-backend" stroke-width="1.5"/>
        <text x="710" y="253" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">AgentCore Gateway</text>
        <text x="710" y="269" class="t-muted" font-size="9" text-anchor="middle">MCP endpoint, AWS_IAM auth</text>

        <rect x="620" y="400" width="180" height="60" rx="6" class="c-mask"/>
        <rect x="620" y="400" width="180" height="60" rx="6" class="c-database" stroke-width="1.5"/>
        <text x="710" y="428" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">S3</text>
        <text x="710" y="444" class="t-muted" font-size="9" text-anchor="middle">data, outputs, replay evidence</text>

        <rect x="620" y="540" width="180" height="60" rx="6" class="c-mask"/>
        <rect x="620" y="540" width="180" height="60" rx="6" class="c-database" stroke-width="1.5"/>
        <text x="710" y="568" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">AgentCore Memory</text>
        <text x="710" y="584" class="t-muted" font-size="9" text-anchor="middle">EPISODIC allocation history</text>

        <rect x="920" y="80" width="200" height="60" rx="6" class="c-mask"/>
        <rect x="920" y="80" width="200" height="60" rx="6" class="c-cloud" stroke-width="1.5"/>
        <text x="1020" y="108" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">Lambda: get_weather</text>
        <text x="1020" y="124" class="t-muted" font-size="9" text-anchor="middle">Open-Meteo + mock fallback</text>

        <rect x="920" y="170" width="200" height="60" rx="6" class="c-mask"/>
        <rect x="920" y="170" width="200" height="60" rx="6" class="c-cloud" stroke-width="1.5"/>
        <text x="1020" y="198" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">Lambda: get_events</text>
        <text x="1020" y="214" class="t-muted" font-size="9" text-anchor="middle">Paris Open Data + mock</text>

        <rect x="920" y="260" width="200" height="60" rx="6" class="c-mask"/>
        <rect x="920" y="260" width="200" height="60" rx="6" class="c-cloud" stroke-width="1.5"/>
        <text x="1020" y="288" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">Lambda: get_mobility</text>
        <text x="1020" y="304" class="t-muted" font-size="9" text-anchor="middle">hour-of-week forecast</text>

        <rect x="920" y="350" width="200" height="60" rx="6" class="c-mask"/>
        <rect x="920" y="350" width="200" height="60" rx="6" class="c-cloud" stroke-width="1.5"/>
        <text x="1020" y="378" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">Lambda: get_zones</text>
        <text x="1020" y="394" class="t-muted" font-size="9" text-anchor="middle">reads S3</text>

        <rect x="920" y="440" width="200" height="60" rx="6" class="c-mask"/>
        <rect x="920" y="440" width="200" height="60" rx="6" class="c-cloud" stroke-width="1.5"/>

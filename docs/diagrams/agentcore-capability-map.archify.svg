        <text x="815" y="49" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">Build</text>
        <rect x="980" y="30" width="90" height="30" rx="6" class="c-mask"/>
        <rect x="980" y="30" width="90" height="30" rx="6" class="c-backend" stroke-width="1.5"/>
